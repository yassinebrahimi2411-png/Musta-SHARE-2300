<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Musta-SHARE AND مستشار</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"><style>
:root{--bg:#f6f8fb;--card:#fff;--tx:#14213d;--mut:#5b6b82;--bd:#dde4ee;--pri:#1A365D;--cy:#00B4D8;--mg:#7209B7;--bub:#eaf2fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1726;--card:#16233a;--tx:#e8eef8;--mut:#9fb0c8;--bd:#263753;--pri:#7fb0ff;--bub:#1b2d4a}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;max-width:900px;margin:auto}
header{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
header img{height:44px;background:#fff;border-radius:8px;padding:2px}
.t{flex:1;min-width:150px}.t b{font-size:15px;color:var(--pri)}.t small{display:block;color:var(--mut);font-size:12px}
.lang button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:5px 9px;border-radius:8px;cursor:pointer;margin-inline-start:4px}
.lang button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.m{max-width:88%;padding:10px 13px;border-radius:14px;line-height:1.6;font-size:15px;white-space:pre-wrap}
.u{align-self:flex-end;background:var(--pri);color:#fff}.b{align-self:flex-start;background:var(--card);border:1px solid var(--bd)}
.src{display:inline-block;margin:6px 4px 0 0;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--bub);color:var(--pri);border:1px solid var(--cy)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}.chips button{border:1px solid var(--mg);color:var(--mg);background:transparent;border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer}
form{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--bd)}
input[type=text]{flex:1;padding:11px 13px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px}
.btn{border:0;border-radius:12px;padding:0 16px;background:var(--cy);color:#00202b;font-weight:600;cursor:pointer}
label.btn{display:flex;align-items:center;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
footer{font-size:11px;color:var(--mut);padding:0 14px 8px;text-align:center}
</style>
<style>
:root[data-theme=dark]{--bg:#0b1322;--card:#15233b;--tx:#e8eef8;--mut:#9fb0c8;--pri:#7fb0ff;--bub:#1b2d4a;--bd:#263753}
html{background:var(--bg);transition:background .4s}
body{background:transparent;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;position:relative}
html[lang=ar] body,html[lang=ar] input{font-family:Cairo,"Segoe UI",Tahoma,sans-serif}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:radial-gradient(520px 380px at 12% 8%,rgba(0,180,216,.25),transparent 70%),radial-gradient(480px 380px at 92% 85%,rgba(114,9,183,.2),transparent 70%),radial-gradient(360px 300px at 70% 20%,rgba(26,54,93,.18),transparent 70%);animation:drift 16s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(3%,4%) scale(1.12)}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes bl{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
@keyframes flow{to{background-position:200% 0}}
@keyframes bob{50%{transform:translateY(-3px)}}
header{margin:10px 12px 0;border:1px solid var(--bd);border-radius:20px;background:color-mix(in srgb,var(--card) 72%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(10,30,70,.1);gap:10px 12px}
header img{height:clamp(30px,6.5vw,46px);width:auto;animation:bob 5s ease-in-out infinite;transition:transform .3s}
header img:hover{transform:scale(1.08) rotate(-2deg)}
.t b{font-size:clamp(20px,4.5vw,26px);font-weight:700;letter-spacing:.2px;background:linear-gradient(90deg,var(--pri),var(--cy),var(--mg),var(--pri));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
.t small{margin-top:2px}
.lang{display:flex;gap:6px;align-items:center}
.lang button{margin:0;font-size:20px;line-height:1;padding:6px 9px;border-radius:12px;transition:transform .2s,box-shadow .2s,background .3s}
.lang button:hover{transform:translateY(-2px) scale(1.08)}
.lang button.on{background:var(--bub);color:inherit;border-color:var(--cy);box-shadow:0 0 0 2px var(--cy);transform:scale(1.1)}
.lang .ic{background:linear-gradient(135deg,#1A365D,#7209B7);border:0;color:#fff}
#chat{scroll-behavior:smooth}
.m{animation:pop .4s cubic-bezier(.2,.8,.2,1);box-shadow:0 4px 16px rgba(10,30,70,.07);border-radius:18px;line-height:1.7}
.u{background:linear-gradient(135deg,#1A365D,#7209B7);color:#fff;border-end-end-radius:6px;border:0}
.b{border-start-start-radius:6px}
.src{transition:transform .2s,background .2s;animation:pop .5s both}.src:hover{transform:translateY(-2px);background:var(--cy);color:#00202b}
.typing{display:flex;gap:5px;padding:14px 16px;align-self:flex-start;background:var(--card);border:1px solid var(--bd);border-radius:18px;animation:pop .3s}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--cy);animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s;background:var(--mg)}.typing i:nth-child(3){animation-delay:.3s}
.chips{flex-wrap:wrap;gap:8px}.chips button{background:color-mix(in srgb,var(--card) 80%,transparent);border-color:var(--mg);font:inherit;font-size:13px;transition:transform .2s,background .2s,color .2s,box-shadow .2s;animation:pop .5s both}
.chips button:nth-child(2){animation-delay:.08s}.chips button:nth-child(3){animation-delay:.16s}.chips button:nth-child(4){animation-delay:.24s}
.chips button:hover{transform:translateY(-3px);background:var(--mg);color:#fff;box-shadow:0 6px 16px rgba(114,9,183,.3)}
form{margin:0 12px 6px;border:1px solid var(--bd);border-radius:20px;background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:blur(12px);padding:8px}
input[type=text]{border:0;background:transparent;font:inherit;outline:0}
form:focus-within{box-shadow:0 0 0 2px var(--cy)}
.btn{font:inherit;font-weight:600;border-radius:14px;padding:10px 18px;background:linear-gradient(135deg,var(--cy),#4cc9f0);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,180,216,.4)}.btn:active{transform:scale(.96)}
label.btn{background:var(--card);font-size:18px;padding:8px 14px}
body,header,.m,form,.chips button,.lang button{transition:background .35s,color .35s,border-color .35s}
@media(max-width:520px){header{padding:8px 10px}.m{max-width:94%}.t{min-width:0;flex-basis:100%;order:3}}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
#live{font-size:11px;font-weight:700;color:#0a7d3c;background:rgba(40,200,100,.16);padding:4px 10px;border-radius:99px;margin-inline-end:4px}#live::before{content:"● ";display:inline-block;animation:bl 1.4s infinite}
.fu{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.fu button{font:inherit;font-size:12.5px;border:1px solid var(--cy);color:var(--pri);background:transparent;border-radius:99px;padding:4px 11px;cursor:pointer;transition:transform .2s,background .2s}.fu button:hover{transform:translateY(-2px);background:var(--bub)}
</style></head><body>

const UI={en:{tag:"Your documents, your regulations, your verified answers.",ph:"Ask about Decree 1275 / 008, labels, incubators…",go:"Ask",hi:"Hello! I answer only from the regulatory texts loaded here and from the .txt/.md files you upload. Every answer cites its source.",nf:"According to the official guidelines of UBMA House of AI and available regulatory texts, this specific detail is not covered. Please consult your university incubator or CATI office.",ft:"Knowledge base: Decrees 1275/008, CNCSIIU mechanisms, INAPI form · verify against official texts · House of AI, UBMA Annaba",ok:"Added to knowledge base: ",s:["What is Decree 1275?","What changed with Decree 008?","Which labels exist?","Steps for my startup thesis"]},
fr:{tag:"Vos documents, vos règlements, vos réponses vérifiées.",ph:"Posez une question sur l’arrêté 1275 / 008, les labels…",go:"Envoyer",hi:"Bonjour ! Je réponds uniquement à partir des textes réglementaires chargés ici et des fichiers .txt/.md que vous ajoutez. Chaque réponse cite sa source.",nf:"Selon les directives officielles de la Maison de l’IA de l’UBMA et les textes disponibles, ce détail n’est pas couvert. Veuillez consulter votre incubateur universitaire ou le CATI.",ft:"Base : arrêtés 1275/008, mécanismes CNCSIIU, formulaire INAPI · à vérifier avec les textes officiels · Maison de l’IA, UBMA Annaba",ok:"Ajouté à la base : ",s:["Qu’est-ce que l’arrêté 1275 ?","Qu’apporte l’arrêté 008 ?","Quels labels existent ?","Étapes pour mon mémoire startup"]},
ar:{tag:"وثائقك، لوائحك، إجاباتك الموثّقة.",ph:"اسأل عن القرار 1275 / 008، العلامات، الحاضنات…",go:"إرسال",hi:"مرحبا! أجيب فقط انطلاقا من النصوص التنظيمية المحمّلة هنا والملفات (txt/md) التي ترفعها، وكل إجابة تذكر مصدرها.",nf:"وفقا للتوجيهات الرسمية لدار الذكاء الاصطناعي بجامعة عنابة والنصوص المتاحة، هذه التفصيلة غير مغطاة. يرجى استشارة حاضنة جامعتك أو مكتب CATI.",ft:"القاعدة: القراران 1275/008 وآليات اللجنة الوطنية واستمارة INAPI · تحقق من النصوص الرسمية · دار الذكاء الاصطناعي، جامعة عنابة",ok:"أُضيف إلى القاعدة: ",s:["ما هو القرار 1275؟","ما الذي جاء به القرار 008؟","ما هي أنواع العلامات؟","خطوات مذكرة التخرج مؤسسة ناشئة"]}};
const KB=[
{s:"Decree 1275 (27/09/2022)",k:"1275 decree arrete قرار thesis memoire مذكرة diploma شهادة startup patent brevet براءة ناشئة ما هو what est",en:"Ministerial Decree 1275 of 27 September 2022 sets how students prepare a graduation thesis to obtain a university diploma “Startup” or “Patent”.",fr:"L’arrêté ministériel 1275 du 27 septembre 2022 fixe les modalités du mémoire de fin d’études pour l’obtention d’un diplôme universitaire « Startup » ou « Brevet ».",ar:"القرار الوزاري 1275 المؤرخ في 27 سبتمبر 2022 يحدد كيفيات إعداد مذكرة تخرج للحصول على شهادة جامعية «مؤسسة ناشئة» أو «براءة اختراع»."},
{s:"Decree 008 (23/02/2025)",k:"008 amend modifie معدل المتمم changed جديد apporte new facilitation تسهيلات supplement complete",en:"Decree 008 of 23 February 2025 amends and supplements Decree 1275: it adds new facilitations and clarifies how innovative university projects are created and evaluated.",fr:"L’arrêté 008 du 23 février 2025 modifie et complète l’arrêté 1275 : nouvelles facilités et clarification de la création et de l’évaluation des projets universitaires innovants.",ar:"القرار 008 المؤرخ في 23 فيفري 2025 يعدّل ويتمّم القرار 1275، بإدراج تسهيلات جديدة وتوضيح كيفيات إنشاء وتقييم المشاريع الجامعية المبتكرة."},
{s:"Decree 008, Art. 06",k:"orientation cell cellule توجيه خلايا incubator حاضنة cde interfaces واجهات article 06 المادة",en:"Art. 06 of Decree 008 sets up orientation cells that guide students to the right university interfaces, such as university business incubators and Entrepreneurship Development Centers (CDE).",fr:"L’art. 06 de l’arrêté 008 institue des cellules d’orientation qui dirigent les étudiants vers les interfaces adéquates : incubateurs universitaires, centres de développement de l’entrepreneuriat (CDE).",ar:"المادة 06 من القرار 008 تنص على خلايا التوجيه لتوجيه الطلبة نحو الواجهات الجامعية المناسبة، كحاضنات الأعمال الجامعية ومراكز تطوير المقاولاتية."},
{s:"Univ. circulars (MESRS)",k:"lab labs fablab مخابر مخبر prototype نموذج أولي manufacturing تصنيع laboratoire",en:"Students enrolled under Decree 1275 and directed to a CDE may use manufacturing, pedagogical and research labs to build their prototypes.",fr:"Les étudiants inscrits dans le cadre de l’arrêté 1275 et orientés vers un CDE peuvent utiliser les laboratoires de fabrication, pédagogiques et de recherche pour leurs prototypes.",ar:"يستفيد الطلبة المنخرطون في القرار 1275 الموجَّهون إلى مراكز تطوير المقاولاتية من مخابر التصنيع والمخابر البيداغوجية والبحثية لإعداد نماذجهم الأولية."},
{s:"Exec. Decree 20-254 / 25-311",k:"label labels علامة علامات types أنواع quels scale-up متسارعة incubator innovative project مشروع مبتكر 20-254 25-311 exist",en:"Four labels exist: Innovative Project, Startup, Business Incubator and Scale-up (the fourth added by Exec. Decree 25-311 of 1 Dec 2025, amending 20-254).",fr:"Quatre labels existent : Projet innovant, Startup, Incubateur et Scale-up (ce dernier ajouté par le décret exécutif 25-311 du 1er déc. 2025, modifiant le 20-254).",ar:"توجد أربع علامات: مشروع مبتكر، مؤسسة ناشئة، حاضنة أعمال، ومؤسسة متسارعة (Scale-up) التي استُحدثت بالمرسوم التنفيذي 25-311 المؤرخ في 1 ديسمبر 2025 المعدّل للمرسوم 20-254."},
{s:"Exec. Decree 25-311, Art. 19",k:"duration durée مدة validity renew renouvelable تجديد years ans سنوات innovative project startup",en:"Innovative Project label: 2 years, renewable twice. Startup label: 4 years, renewable once. Scale-up label: 4 years, renewable.",fr:"Label Projet innovant : 2 ans, renouvelable deux fois. Label Startup : 4 ans, renouvelable une fois. Label Scale-up : 4 ans, renouvelable.",ar:"علامة مشروع مبتكر: سنتان قابلة للتجديد مرتين. علامة مؤسسة ناشئة: 4 سنوات قابلة للتجديد مرة واحدة. علامة Scale-up: 4 سنوات قابلة للتجديد."},
{s:"Exec. Decree 20-254, Art. 11",k:"startup criteria conditions شروط معايير critères 8 years 250 employees capital 50 عمال",en:"Startup label criteria: company under Algerian law, not older than 8 years, innovative business model, at least 50% of capital held by natural persons / approved funds / labelled startups, strong growth potential, max 250 employees.",fr:"Critères du label Startup : société de droit algérien, moins de 8 ans, modèle innovant, au moins 50 % du capital détenu par des personnes physiques / fonds agréés / startups labellisées, fort potentiel de croissance, 250 salariés max.",ar:"شروط علامة مؤسسة ناشئة: شركة خاضعة للقانون الجزائري، عمرها لا يتجاوز 8 سنوات، نموذج أعمال مبتكر، 50% على الأقل من رأس المال لأشخاص طبيعيين أو صناديق معتمدة أو مؤسسات موسومة، إمكانات نمو كبيرة، وألا يتجاوز عدد العمال 250."},
{s:"Univ. Sétif 2 incubator plan",k:"steps étapes خطوات procedure process مسار bmc cati inapi onda deposit إيداع feasibility study startup.dz thesis mémoire مذكرة",en:"Typical path in a university incubator plan: business model (BMC) and project sheet → technical/economic feasibility study → CATI licence → deposit number (ONDA / INAPI) → registration on startup.dz → defence and evaluation for the “Innovative Project” label.",fr:"Parcours type d’un plan d’incubateur universitaire : BMC et fiche projet → étude de faisabilité technique/économique → licence CATI → numéro de dépôt (ONDA / INAPI) → inscription sur startup.dz → soutenance et évaluation pour le label « Projet innovant ».",ar:"المسار النموذجي في خطة حاضنة جامعية: إعداد BMC وبطاقة فنية للمشروع ← دراسة جدوى تقنية واقتصادية ← رخصة CATI ← رقم الإيداع (ONDA / INAPI) ← التسجيل في منصة startup.dz ← مناقشة المشروع وتقييمه للحصول على علامة «مشروع مبتكر»."},
{s:"startup.dz (MKEStartup)",k:"startup.dz platform plateforme منصة apply demande طلب committee لجنة file dossier ملف",en:"Label applications are filed online on the official platform startup.dz and examined by the National Committee.",fr:"Les demandes de label se déposent en ligne sur la plateforme officielle startup.dz et sont examinées par le Comité national.",ar:"تُودَع طلبات العلامات إلكترونيا على المنصة الرسمية startup.dz وتدرسها اللجنة الوطنية."},
{s:"MESRS circular 001 (18/05/2023)",k:"defence defense soutenance مناقشة circular circulaire منشور 001 jury",en:"Circular 001 of 18 May 2023 sets how the end-of-study project aimed at creating a startup or patent is defended.",fr:"La circulaire 001 du 18 mai 2023 fixe les modalités de soutenance du projet de fin d’études visant à créer une startup ou un brevet.",ar:"المنشور رقم 001 المؤرخ في 18 ماي 2023 يحدد كيفيات مناقشة مشروع نهاية الدراسة المعدّ بغرض إنشاء مؤسسة ناشئة أو براءة اختراع."},
{s:"Arrêté 008, Art. 1-2 (amends 1275 Art. 1-2)",k:"008 title titre عنوان economic enterprise مؤسسة اقتصادية micro microentreprise مصغرة projet entreprise economique مشروع amend modifie",en:"Decree 008 renames the diploma “University Diploma – Economic Enterprise Project”. Its aim: a generation of student entrepreneurs creating startups, micro-enterprises or any other job-creating economic enterprise.",fr:"L’arrêté 008 renomme le diplôme « Diplôme universitaire – Projet d’entreprise économique » : former des étudiants entrepreneurs créant startups, micro-entreprises ou toute autre entreprise créatrice d’emplois.",ar:"يعدّل القرار 008 التسمية إلى «شهادة جامعية – مشروع مؤسسة اقتصادية»، والهدف خلق جيل من الطلبة رواد الأعمال لإنشاء مؤسسات ناشئة أو مصغرة أو أي شكل آخر من المؤسسات الخلاقة للثروة ومناصب الشغل."},
{s:"Arrêté 008, Art. 3 (amends 1275 Art. 3)",k:"format formats thesis memoire مذكرة chapters فصلين theoretical applied نظري تطبيقي business model نموذج تجاري technical economic sheet بطاقة تقنية اقتصادية option",en:"The thesis can take one of two formats: (1) a thesis with two chapters, one theoretical and one applied (business model or technical-economic sheet); (2) a thesis with fully applied content as a business model or technical-economic sheet.",fr:"Le mémoire peut prendre deux formes : (1) deux chapitres, l’un théorique, l’autre appliqué (business model ou fiche technico-économique) ; (2) contenu entièrement appliqué sous forme de business model ou fiche technico-économique.",ar:"يمكن إعداد المذكرة وفق صيغتين: الأولى مذكرة من فصلين أحدهما نظري والآخر تطبيقي في شكل نموذج تجاري أو بطاقة تقنية واقتصادية؛ والثانية مذكرة بمحتوى تطبيقي كامل في شكل نموذج تجاري أو بطاقة تقنية واقتصادية."},
{s:"Arrêté 1275, Art. 4-7 (as amended)",k:"who eligible students طلبة licence master doctorat ingenieur engineering architecture veterinary team teams équipe فريق 2 6 groupe training formation دورات workshops final year foreign étranger أجنبي",en:"Open to licence, master, doctorate, engineering, architecture and veterinary students (Art. 4). Teams of 2 to 6 students from different specialties may work together (Art. 7). A student with an idea, foreign students included, especially in the final year, can be supported by incubators, CDE or CATI (Art. 6 as amended). Registered students get training and workshops on business model, marketing, management, accounting and finance (Art. 5).",fr:"Ouvert aux étudiants de licence, master, doctorat, ingénierie, architecture et vétérinaire (Art. 4). Équipes de 2 à 6 étudiants de spécialités différentes (Art. 7). Tout étudiant porteur d’idée, étranger inclus, surtout en dernière année, peut être accompagné par incubateur, CDE ou CATI (Art. 6 modifié). Formations sur le business model, marketing, management, comptabilité et finance (Art. 5).",ar:"يسمح لطلبة الليسانس والماستر والدكتوراه والهندسة والهندسة المعمارية والبيطرة (المادة 4). يمكن تكوين فرق من 2 إلى 6 طلبة من تخصصات مختلفة (المادة 7). ويمكن للطالب حامل الفكرة، بمن فيهم الأجنبي، لاسيما في السنة الأخيرة، الاستفادة من مرافقة الحاضنة أو مركز تطوير المقاولاتية أو CATI (المادة 6 المعدلة). ويتلقى دورات وورشات حول نموذج الأعمال والتسويق والمناجمنت والمحاسبة والمالية (المادة 5)."},
{s:"Arrêté 008, Art. 6 (amends 1275 Art. 8)",k:"orientation cell cellule توجيه خلية composition تشكيلة members أعضاء director مدير house ai دار الذكاء الاصطناعي anade mission",en:"Each institution creates an Orientation Cell that guides students to the right interface to create their enterprise (startup, micro-enterprise, national or international patent). Members: the vice-rector for training, directors of the incubator, of the CDE, of CATI and of the House of AI, plus an ANADE representative or an economic/social partner.",fr:"Chaque établissement crée une cellule d’orientation qui oriente les étudiants vers l’interface adéquate (startup, micro-entreprise, brevet national ou international). Membres : vice-recteur chargé de la formation, directeurs de l’incubateur, du CDE, du CATI et de la Maison de l’IA, et un représentant de l’ANADE ou d’un partenaire socio-économique.",ar:"تنشأ لدى كل مؤسسة خلية توجيه تتولى توجيه الطلبة نحو الواجهة المناسبة لإنشاء مؤسستهم (مؤسسة ناشئة، مصغرة، براءة اختراع وطنية أو دولية). تتشكل من نائب مدير الجامعة المكلف بالتكوين، ومدير الحاضنة، ومدير مركز تطوير المقاولاتية، ومدير CATI، ومدير دار الذكاء الاصطناعي، وممثل عن الوكالة الوطنية لدعم وتنمية المقاولاتية أو شريك اقتصادي واجتماعي."},
{s:"Orientation-cell diagnostic (CNCSIIU)",k:"diagnostic flowchart organigramme مخطط which interface quelle واجهة cati incubator cde prior art antériorité أسبقية scalable expansion innovation technological industrial توسع",en:"Orientation logic: if the idea relies on a new technical/industrial innovation and a prior-art search was done → CATI. If not innovative-technical: scalable business model → Incubator; not easily scalable → CDE (Entrepreneurship Development Center).",fr:"Logique d’orientation : idée fondée sur une innovation technique/industrielle nouvelle et recherche d’antériorité faite → CATI. Sinon : modèle d’affaires extensible → Incubateur ; non extensible → CDE.",ar:"منطق التوجيه: إذا اعتمدت الفكرة على ابتكار تقني أو صناعي جديد وتم البحث في الأسبقية → CATI. وإلا: نموذج تجاري قابل للتوسع والتكبير السريع → حاضنة الأعمال؛ غير قابل لذلك → مركز تطوير المقاولاتية (CDE)."},
{s:"Arrêté 008, Art. 7 (amends 1275 Art. 9-10)",k:"defence defense soutenance مناقشة committee jury لجنة composition prize concours مسابقة label innovative project لابل مشروع مبتكر diploma شهادة expert experts",en:"The student presents the project before an expert committee and receives the “Economic Enterprise Project” certificate in addition to the end-of-studies diploma. Committee: supervisor, incubator representative, CDE or CATI representative (as applicable), and a representative of economic/social partners. Best projects enter a national competition with financial support (Art. 10).",fr:"L’étudiant présente son projet devant un comité d’experts et reçoit l’attestation « Projet d’entreprise économique » en plus du diplôme de fin d’études. Comité : encadreur, représentant de l’incubateur, du CDE ou du CATI (selon le cas), représentant des partenaires socio-économiques. Les meilleurs projets participent à un concours national doté (Art. 10).",ar:"يحصل الطالب بعد عرض مشروعه ومناقشته أمام لجنة خبراء على شهادة «مشروع مؤسسة اقتصادية» إضافة إلى شهادة نهاية الدراسة. تتشكل لجنة المناقشة من المشرف وممثل عن الحاضنة أو مركز تطوير المقاولاتية أو CATI حسب الحالة وممثل عن الشركاء الاقتصاديين والاجتماعيين. وتشارك المشاريع المتميزة في مسابقة وطنية بدعم مالي (المادة 10)."},
{s:"CNCSIIU mechanisms, axis 1 (evaluation)",k:"evaluation criteria تقييم معايير grading note points 20 25 30 bmc prototype نموذج أولي innovation cati licence رخصة deposit إيداع onda inapi before defence label 100",en:"Evaluation criteria: clarity and soundness of the core idea 20%, innovative aspects 25%, soundness of the business model (BMC) 30%, access to a prototype 25%. Getting the “Innovative Project” label means full marks (100%). A project cannot be defended before it has a CATI licence and a deposit number from ONDA/INAPI (if it improves an existing product or is a new innovation).",fr:"Critères : clarté et solidité de l’idée 20 %, aspects innovants 25 %, solidité du BMC 30 %, accès au prototype 25 %. L’obtention du label « Projet innovant » équivaut à 100 %. Pas de soutenance sans licence CATI et numéro de dépôt ONDA/INAPI (si amélioration d’un produit existant ou nouvelle innovation).",ar:"معايير التقييم: وضوح الفكرة الأساسية وسلامتها 20%، الجوانب الابتكارية 25%، صحة نموذج العمل التجاري BMC 30%، الوصول إلى النموذج الأولي 25%. الحصول على وسم «لابل مشروع مبتكر» يعني الحصول على 100%. ولا يعرض المشروع للمناقشة قبل حصوله على ترخيص من CATI ورقم الإيداع لدى الجهات المعنية بالحماية (ONDA، INAPI) إن كان فيه تحسين لمنتج قائم أو ابتكار جديد."},
{s:"CNCSIIU mechanisms, axis 1 (supervision, certificate)",k:"supervision supervisor مشرف encadrement defence committee examiner external expert thesis 30 pages certificate attestation شهادة sub-certificate dean doyen signed",en:"Supervision options: one supervisor; a main supervisor plus an assistant supervisor (can be an incubator/CDE trainer); or two main supervisors for multidisciplinary ideas plus an assistant. Defence committee: supervisor(s), an examiner on the core idea, a BMC specialist, and ideally an external expert (preferably an economic partner). The classic thesis plus a stand-alone BMC/technical-sheet annex is about 30 pages. The sub-certificate is validated by the faculty dean, the incubator director and the university director.",fr:"Encadrement : un encadreur ; un encadreur principal + un co-encadreur (formateur d’incubateur/CDE) ; ou deux encadreurs principaux si l’idée est pluridisciplinaire. Jury : encadreur(s), examinateur de l’idée, spécialiste BMC, idéalement un expert externe (partenaire économique). Mémoire classique + annexe BMC/fiche technique d’environ 30 pages. L’attestation est validée par le doyen, le directeur de l’incubateur et le directeur de l’université.",ar:"الإشراف: مشرف واحد؛ أو مشرف رئيسي مع مشرف مساعد (يمكن أن يكون من مدربي الحاضنة أو دار المقاولاتية)؛ أو مشرفان رئيسيان إذا تطلبت الفكرة تخصصين مع مشرف مساعد. لجنة المناقشة: المشرف أو فريق الإشراف وأستاذ مناقش للفكرة وأستاذ مختص في BMC وخبير من خارج الجامعة يحبذ أن يكون من الشركاء الاقتصاديين. المذكرة التقليدية مع ملحق BMC والبطاقة الفنية في حدود 30 صفحة. وتتم المصادقة على الشهادة الفرعية من طرف عميد الكلية ومدير الحاضنة ومدير الجامعة."},
{s:"CNCSIIU mechanisms, axis 4 (patents)",k:"patent patents brevet براءة اختراع cati role مهام ownership propriete ملكية fees frais رسوم anvredet university owner inventors مخترعين search recherche",en:"CATI centres (set up by agreements with INAPI) run awareness caravans, standardise filing at incubators, search international databases, speed up the deposit number, and work with ONDA and INAPI. The university pays IP fees for students. Ownership of a patent is shared between the student team and supervising professors; the university is the legal owner since it is registered in its name (its director may waive the commercial right in favour of the inventors). If an outside party such as ANVREDET is involved, attach an agreement defining rights and duties.",fr:"Les CATI (créés par convention avec l’INAPI) mènent des caravanes de sensibilisation, standardisent le dépôt, font des recherches dans les bases internationales, accélèrent l’obtention du numéro de dépôt et travaillent avec l’ONDA et l’INAPI. L’université prend en charge les frais de PI des étudiants. La propriété du brevet est partagée entre l’équipe étudiante et les enseignants encadrants ; l’université est propriétaire moral (son directeur peut céder le droit commercial aux inventeurs). Si un tiers (ex. ANVREDET) participe, joindre une convention fixant droits et obligations.",ar:"تقوم مراكز CATI (بموجب اتفاقيات مع INAPI) بقوافل تحسيسية وتنميط إجراءات التسجيل والبحث في قواعد البيانات الدولية وتسريع الحصول على رقم الإيداع والعمل مع ONDA وINAPI. وتتكفل الجامعة بمصاريف ورسوم الملكية الفكرية للطلبة. وتتوزع ملكية البراءة بين الطلبة أعضاء الفريق والأساتذة المشرفين، والجامعة هي المالك المعنوي كونها تسجل باسمها (ويمكن لمدير الجامعة التنازل عن الحق التجاري لصالح المخترعين). وفي حالة إشراك طرف خارجي كـ ANVREDET يفضل إرفاق طلب التسجيل باتفاقية تحدد الحقوق والواجبات."},
{s:"CNCSIIU mechanisms, axes 2, 4 (prototypes), 5 (funding)",k:"prototype prototypes نموذج أولي fablab fab-lab مخبر تصنيع labs laboratoires funding financement تمويل asf anade ibtikar ابتكار anvredet analyses تحاليل",en:"Prototypes: institutions publish lab equipment on a digital platform; a lab coordinator helps project holders; the university funds prototypes from its own budget or via the Ibtikar platform / ANVREDET; incubators should set up Fab-Labs. Funding: the ministry’s agreement with the knowledge-economy ministry urges ASF and ANADE to prioritise student projects; projects with a low innovation rate are directed to ANADE.",fr:"Prototypes : plateforme numérique des équipements de laboratoire, coordinateur des labos, financement par le budget de l’université ou la plateforme Ibtikar / ANVREDET ; Fab-Labs dans les incubateurs. Financement : la convention avec le ministère de l’économie de la connaissance incite l’ASF et l’ANADE à prioriser les projets étudiants ; les projets peu innovants sont orientés vers l’ANADE.",ar:"النماذج الأولية: إنشاء منصة رقمية للتجهيزات المخبرية، ومنسق للمخابر يسهل على الطلبة تجسيد نماذجهم، وتتكفل الجامعة بذلك من ميزانيتها أو عبر منصة «ابتكار» أو وكالة ANVREDET، وإنشاء مخابر Fab-Lab بالحاضنات. التمويل: تفعيل الاتفاقية مع وزارة اقتصاد المعرفة لحث صندوق ASF والوكالة ANADE على أخذ مشاريع الطلبة كأولوية، وتوجيه المشاريع ذات معدل الابتكار الأقل إلى ANADE."},
{s:"CNCSIIU timeline 2022/2023 (indicative)",k:"timeline calendar calendrier رزنامة dates schedule planning deadlines announcement titles training workshops label defence 2022 2023 مواعيد",en:"Indicative 2022/2023 calendar (institutions may adjust): announcement and registration 6–20 Nov; choosing project titles 20–30 Nov; training workshops 1 Dec–31 May; prototype and technical-economic sheet 16 Jan–9 Apr; startup.dz registration training 10–15 Apr; company-creation and IP training 16 Apr–5 May; “Innovative Project” label period 6–21 May; defences 22 May–15 Jun.",fr:"Calendrier indicatif 2022/2023 (modifiable par les établissements) : annonce et inscription 6–20 nov. ; choix des titres 20–30 nov. ; formations 1er déc.–31 mai ; prototype et fiche technico-économique 16 janv.–9 avr. ; formation d’inscription sur startup.dz 10–15 avr. ; création d’entreprise et PI 16 avr.–5 mai ; label « Projet innovant » 6–21 mai ; soutenances 22 mai–15 juin.",ar:"الرزنامة الإرشادية 2022/2023 (يمكن للمؤسسات تعديلها): الإعلان والتسجيل 6–20 نوفمبر؛ اختيار عناوين المشاريع 20–30 نوفمبر؛ الورشات التدريبية 1 ديسمبر–31 ماي؛ إعداد النموذج الأولي والبطاقة التقنية والاقتصادية 16 جانفي–9 أفريل؛ التدريب على التسجيل في startup.dz 10–15 أفريل؛ تدريب إنشاء المؤسسة والملكية الفكرية 16 أفريل–5 ماي؛ فترة الحصول على وسم «لابل مشروع مبتكر» 6–21 ماي؛ المناقشات 22 ماي–15 جوان."},
{s:"Patent thesis guide (CNCSIIU)",k:"patent guide guide brevet دليل براءة thesis structure plan description abstract résumé ملخص technical field etat technique prior art claims revendications مطالب title titre figures annexes",en:"Patent thesis guide: Axis 1 presentation (idea, proposed values, inventors, objectives, schedule); Axis 2 description (title ≤10 words without abbreviations, abstract ~250 words, technical field, prior art, purpose, essence of the invention, explanation of figures, operating mechanism); Axis 3 claims (a main claim = the added value, plus dependent claims); Axis 4 annexes (figures, tables, drawings without explanations).",fr:"Guide du mémoire brevet : Axe 1 présentation (idée, valeurs proposées, inventeurs, objectifs, calendrier) ; Axe 2 description (titre ≤10 mots sans abréviations, résumé ~250 mots, domaine technique, état de la technique, but, essence de l’invention, explication des figures, mécanisme) ; Axe 3 revendications (principale = valeur ajoutée, plus dépendantes) ; Axe 4 annexes (figures, tableaux, dessins sans explications).",ar:"دليل مذكرة براءة الاختراع: المحور 1 تقديم المشروع (الفكرة، القيم المقترحة، فريق المخترعين، الأهداف، الجدول الزمني)؛ المحور 2 وصف البراءة (العنوان في حدود 10 كلمات دون اختصارات، ملخص 250 كلمة، الميدان التقني، الحالة التقنية السابقة، الغرض، جوهر الاختراع، شرح الأشكال، آلية العمل)؛ المحور 3 المطالب (مطلب رئيسي هو القيمة المضافة ومطالب مستنبطة)؛ المحور 4 الملاحق (أشكال وجداول ورسومات دون شرح)."},
{s:"INAPI form R2-FO-03",k:"inapi form formulaire استمارة dossier depot dépôt filing submit apply request requête demande brevet d’invention certificat addition pct address adresse fee taxe email",en:"INAPI patent request (form R2-FO-03): choose the nature (patent of invention, PCT extension, certificate of addition); give applicant, inventors, title, priority claims; enclose the abstract, the description in the national language and the original in French, drawings, power of attorney if any, and proof of fee payment. Submit in person or by registered post to INAPI, 42 rue Larbi Ben M’hidi, Algiers (brevet@inapi.dz).",fr:"Requête de délivrance INAPI (formulaire R2-FO-03) : cocher la nature (brevet d’invention, extension PCT, certificat d’addition) ; indiquer déposant, inventeurs, titre, priorités ; joindre abrégé, mémoire descriptif en langue nationale et original en français, dessins, pouvoir et preuve du paiement des taxes. Dépôt direct ou par pli recommandé à l’INAPI, 42 rue Larbi Ben M’hidi, Alger (brevet@inapi.dz).",ar:"طلب تسليم براءة لدى INAPI (استمارة R2-FO-03): تحديد طبيعة الطلب (براءة اختراع، تمديد طلب دولي PCT، شهادة إضافة)، وبيان المودع والمخترعين والعنوان وطلبات الأولوية، وإرفاق الملخص والوصف باللغة الوطنية والأصل بالفرنسية والرسومات والوكالة إن وجدت وإثبات دفع الرسوم. يودع الطلب مباشرة أو برسالة موصى عليها لدى INAPI، 42 شارع العربي بن مهيدي، الجزائر (brevet@inapi.dz)."},
{s:"Startup journey (CNCSIIU slide)",k:"stages étapes مراحل journey parcours idea idée فكرة mvp pmf prototype scaling early use product market fit minimum viable",en:"Journey from idea to startup: Prototype → MVP → Early Use → PMF (product-market fit) → Scaling.",fr:"Du concept à la startup : Prototype → MVP → premiers usages (Early Use) → PMF (adéquation produit-marché) → Scaling (croissance).",ar:"مسار الفكرة إلى المؤسسة الناشئة: نموذج أولي (Prototype) ← منتج أدنى قابل للتطبيق (MVP) ← الاستخدام المبكر (Early Use) ← ملاءمة المنتج للسوق (PMF) ← التوسع (Scaling)."},
{s:"NESDA (ex-ANADE; also spelled NASDA)",fr:"NESDA (parfois écrit NASDA) est l’Agence nationale de soutien et de développement de l’entrepreneuriat, anciennement ANADE, sous la tutelle du ministère de l’Économie de la connaissance, des Startups et des Micro-entreprises. Elle finance les micro-projets via sa plateforme numérique. Financement triangulaire : apport personnel de 5 à 15 %, prêt non rémunéré de la NESDA de 15 à 25 %, banque partenaire environ 70 %. Pour les chômeurs ou étudiants : 5 % d’apport, 25 % NESDA, 70 % banque. En 2024, la NESDA a lancé le financement des porteurs de projets étudiants formés dans les CDE universitaires.",ar:"NESDA (وتُكتب أحيانا NASDA) هي الوكالة الوطنية لدعم وتنمية المقاولاتية، ANADE سابقا، التابعة لوزارة اقتصاد المعرفة والمؤسسات الناشئة والمؤسسات المصغرة. تمول المشاريع المصغرة عبر منصتها الرقمية. التمويل الثلاثي: مساهمة شخصية 5–15%، وقرض بدون فوائد من الوكالة 15–25%، وبنك شريك نحو 70%. وللبطالين أو الطلبة: مساهمة 5% والوكالة 25% والبنك 70%. وفي 2024 أطلقت الوكالة تمويل حاملي المشاريع من الطلبة المكوَّنين في مراكز تطوير المقاولاتية الجامعية.",pub:1,k:"nesda nasda anade agence entrepreneuriat micro projet microentreprise financement loan interest-free triangulaire bank student etudiant 5% 25% 70% وكالة دعم تنمية المقاولاتية مصغرة تمويل قرض بنك",en:"NESDA (sometimes written NASDA) is the National Agency for Support and Development of Entrepreneurship, formerly ANADE, under the Ministry of Knowledge Economy, Startups and Micro-enterprises. It finances micro-projects through its digital platform. Triangular financing: entrepreneur contributes 5–15%, NESDA grants an interest-free loan of 15–25%, and a partner bank funds about 70%. For unemployed people or students the personal contribution is 5%, NESDA 25%, bank 70%. In 2024 NESDA launched financing for student project holders trained in university CDEs."},
{s:"Algerian Startup Fund (ASF)",fr:"Le Fonds algérien des startups (ASF), créé par des banques publiques, investit en capital ou quasi-capital (participations minoritaires) dans des startups à fort potentiel. Le label Startup est généralement la porte d’entrée. Les projets étudiants labellisés doivent être prioritaires pour les financeurs selon la convention ministérielle (axe 5 du CNCSIIU).",ar:"صندوق تمويل المؤسسات الناشئة (ASF) أنشأته بنوك عمومية، ويستثمر في رأس المال أو شبهه (حصص أقلية) في مؤسسات ناشئة ذات إمكانات كبيرة. والحصول على علامة «مؤسسة ناشئة» هو المدخل المعتاد. ويُفترض أن تكون مشاريع الطلبة الحاصلة على العلامة أولوية لدى الممولين بموجب الاتفاقية الوزارية (المحور الخامس للجنة الوطنية).",pub:1,k:"asf algerian startup fund fonds investissement equity capital صندوق تمويل المؤسسات الناشئة funding financing startups",en:"The Algerian Startup Fund (ASF) was created by public banks and invests in equity or quasi-equity (minority stakes) in high-potential startups. Holding the Startup label is the usual entry point. Student projects with the label are meant to be prioritised by funders under the ministry agreement (CNCSIIU axis 5)."},
{s:"CATI / TISC network",fr:"Les CATI (Centres d’appui à la technologie et à l’innovation, TISC) forment un réseau mis en place par l’INAPI avec l’OMPI ; le centre pilote est le CATI-INAPI, et on comptait 54 centres fin 2018, dans des universités, centres de recherche, entreprises et incubateurs. Ils donnent accès aux bases de brevets et aux recherches d’antériorité, forment à la propriété intellectuelle et accompagnent inventeurs et chercheurs. Pour les étudiants du décret 1275, la licence CATI est exigée avant la soutenance.",ar:"مراكز CATI (مراكز دعم التكنولوجيا والابتكار، TISC) شبكة أنشأها المعهد الوطني الجزائري للملكية الصناعية INAPI بالتعاون مع المنظمة العالمية للملكية الفكرية؛ والمركز التجريبي هو CATI-INAPI، وكان عددها 54 مركزا نهاية 2018 داخل الجامعات ومراكز البحث والمؤسسات والحاضنات. توفر الاطلاع على قواعد بيانات البراءات والبحث في الأسبقية، والتكوين في الملكية الفكرية، ومرافقة المخترعين والباحثين. وبالنسبة لطلبة القرار 1275 فرخصة CATI مطلوبة قبل المناقشة.",pub:1,k:"cati tisc technology innovation support center centre appui technologie innovation مركز دعم التكنولوجيا والابتكار inapi ompi wipo patent database prior art مهام role",en:"CATI (Technology and Innovation Support Centers, TISC) form a network set up by INAPI with WIPO; the pilot centre is CATI-INAPI, and there were 54 centres by end-2018, located in universities, research centres, companies and incubators. They give access to patent databases and prior-art searches, IP training and support to inventors and researchers, and help protect and manage intellectual property. For Decree 1275 students, the CATI licence is required before a project goes to defence."},
{s:"CDE (university Entrepreneurship Development Centers)",fr:"Un CDE est une interface universitaire qui sensibilise les étudiants à l’entrepreneuriat et les forme (idéation, bases de gestion, journées portes ouvertes). Il prépare les porteurs de micro-projets au financement NESDA, et des comités de sélection, validation et financement examinent les projets. Dans la cellule d’orientation, un projet non technologique et peu extensible est en général dirigé vers le CDE.",ar:"مركز تطوير المقاولاتية (CDE) واجهة جامعية تحسّس الطلبة بريادة الأعمال وتكوّنهم (توليد الأفكار، أساسيات التسيير، أبواب مفتوحة). ويهيئ حاملي المشاريع المصغرة للتمويل عبر NESDA، وتدرس لجان الانتقاء والمصادقة والتمويل المشاريع. وفي خلية التوجيه يوجَّه عادة إلى المركز المشروع غير التكنولوجي وغير القابل للتوسع السريع.",pub:1,k:"cde centre developpement entrepreneuriat مركز تطوير المقاولاتية role missions training ideation awareness formation sensibilisation financing committee nesda",en:"A CDE is a university interface that raises entrepreneurial awareness and trains students (ideation, business basics, open days). It prepares micro-project holders for NESDA financing, and CDE selection, validation and financing committees review projects. In the orientation cell, a project that is not technology-based and not easily scalable is typically directed to the CDE."},
{s:"Incubator vs CDE vs CATI (which one for me?)",fr:"CATI : votre idée repose sur une innovation technique/industrielle nouvelle et vous avez besoin de recherche d’antériorité, de dépôt de brevet ou de protection PI. Incubateur : modèle d’affaires innovant et extensible visant une startup (mentorat, BMC, prototype, Fab-Lab, label startup.dz). CDE : formation à l’entrepreneuriat et projets de micro-entreprise peu extensibles, financés via la NESDA. La cellule d’orientation de l’université décide avec vous.",ar:"CATI: إذا قامت فكرتك على ابتكار تقني أو صناعي جديد وتحتاج بحثا في الأسبقية أو إيداع براءة أو حماية الملكية الفكرية. الحاضنة: نموذج أعمال مبتكر وقابل للتوسع يستهدف مؤسسة ناشئة (مرافقة، BMC، نموذج أولي، Fab-Lab، علامة startup.dz). CDE: تكوين في المقاولاتية ومشاريع مؤسسات مصغرة محدودة التوسع تُمول عبر NESDA. وتقرر معك خلية التوجيه بالجامعة.",k:"which choose quelle choisir اختيار difference compare incubator حاضنة cde cati orientation idea project scalable innovation",en:"CATI: your idea rests on a new technical/industrial innovation and you need prior-art search, patent filing or IP protection. Incubator: scalable, innovative business model aiming at a startup (mentoring, BMC, prototype, Fab-Lab, startup.dz label). CDE: entrepreneurship training and micro-enterprise projects with limited scalability, financed via NESDA. The university orientation cell decides with you."},
{s:"INAPI: patent basics (Algeria)",fr:"En Algérie, le brevet d’invention est délivré par l’INAPI pour 20 ans à compter du dépôt, sous réserve du paiement des taxes de dépôt et de maintien ; il n’est pas renouvelable. L’invention doit être nouvelle, impliquer une activité inventive, être susceptible d’application industrielle et non contraire à l’ordre public. L’INAPI n’effectuerait qu’un examen de forme (pas d’examen de fond), d’où l’intérêt d’une recherche d’antériorité. L’Algérie est membre du PCT depuis 1999 ; le délai de priorité est de 12 mois. Taxes indicatives d’une fiche du Trésor français de 2018 : environ 7 500 DA au dépôt, 5 000 DA pour la délivrance et la publication, annuités de 5 000 à 18 000 DA (à confirmer auprès de l’INAPI).",ar:"في الجزائر تمنح INAPI براءة الاختراع لمدة 20 سنة من تاريخ الإيداع، بشرط دفع رسوم الإيداع والمحافظة عليها، وهي غير قابلة للتجديد. ويشترط في الاختراع: الجِدّة، والنشاط الابتكاري، والقابلية للتطبيق الصناعي، وعدم مخالفة النظام العام. ويُذكر أن INAPI تجري فحصا شكليا فقط (دون فحص موضوعي)، لذا يُنصح بالبحث في الأسبقية. وانضمت الجزائر إلى معاهدة PCT سنة 1999، وأجل الأولوية 12 شهرا. رسوم تقريبية من وثيقة للخزينة الفرنسية لسنة 2018: نحو 7500 دج للإيداع و5000 دج للمنح والنشر، وسنويات من 5000 إلى 18000 دج (تحقق من الرسوم الحالية لدى INAPI).",pub:1,k:"inapi patent brevet براءة اختراع duration durée مدة 20 ans conditions nouveauté novelty inventive industrial priority pct fees taxes cost cout رسوم cost price",en:"In Algeria a patent of invention is granted by INAPI for 20 years from the filing date, conditional on paying filing and maintenance fees; it is not renewable. The invention must be new, involve an inventive step, be industrially applicable and not contrary to public order. INAPI is reported to examine formal requirements only (no substantive examination), so a prior-art search is strongly advised. Algeria joined the PCT in 1999; the priority period is 12 months. Indicative fees from a 2018 French Treasury sheet: about 7,500 DA to file, 5,000 DA for grant and publication, annuities from 5,000 to 18,000 DA (confirm current fees with INAPI)."},
{s:"INAPI: how to file a patent",fr:"Déposer à l’INAPI : le formulaire de demande, un abrégé descriptif, la description de l’invention en arabe et en français, les dessins si nécessaire et la preuve du paiement des taxes. Minimum pour obtenir une date de dépôt : la volonté d’obtenir un brevet, une description avec au moins une revendication et la preuve du paiement. Dépôt sur place ou par courrier recommandé (formulaire INAPI R2-FO-03). L’équipe étudiante doit d’abord obtenir la licence CATI et demander le numéro de dépôt exigé par le décret 1275 avant la soutenance.",ar:"يُودَع الملف لدى INAPI ويتضمن: استمارة الطلب، وملخصا وصفيا، ووصف الاختراع بالعربية والفرنسية، والرسومات عند الحاجة، وإثبات دفع الرسوم. والحد الأدنى للحصول على تاريخ الإيداع: الرغبة في الحصول على براءة، ووصف مع مطلب واحد على الأقل، وإثبات دفع الرسوم. يتم الإيداع مباشرة أو برسالة موصى عليها (استمارة R2-FO-03). وعلى فريق الطلبة أولا الحصول على رخصة CATI وطلب رقم الإيداع الذي يشترطه القرار 1275 قبل المناقشة.",pub:1,k:"file deposit dépôt إيداع procedure steps étapes application dossier form copies abstract description arabic french claim documents minimum requis",en:"File with INAPI: the request form, a descriptive abstract, the description of the invention in Arabic and French, drawings if needed, and proof of fee payment. Minimum for a filing date: the intention to obtain a patent, a description with at least one claim, and proof of fees. Submit in person or by registered mail (INAPI form R2-FO-03). The student team should first get a CATI licence and ask for the deposit number that Decree 1275 requires before the defence."},
{s:"Related bodies: ONDA, ANVREDET, DGRSDT, CNCSIIU",fr:"ONDA : Office national des droits d’auteur et droits voisins (dépôt des logiciels, contenus, œuvres). ANVREDET : Agence nationale de valorisation des résultats de la recherche et du développement technologique (aide aux prototypes et à la valorisation). DGRSDT : Direction générale de la recherche scientifique et du développement technologique. CNCSIIU : comité national de coordination du suivi de l’innovation et des incubateurs universitaires, auteur des mécanismes de mise en œuvre du décret 1275.",ar:"ONDA: الديوان الوطني لحقوق المؤلف والحقوق المجاورة (إيداع البرمجيات والمحتوى والمصنفات). ANVREDET: الوكالة الوطنية لتثمين نتائج البحث والتطوير التكنولوجي (تساعد في النماذج الأولية والتثمين). DGRSDT: المديرية العامة للبحث العلمي والتطوير التكنولوجي. CNCSIIU: اللجنة الوطنية التنسيقية لمتابعة الابتكار وحاضنات الأعمال الجامعية، وهي التي أعدت آليات تنفيذ القرار 1275.",pub:1,k:"onda anvredet dgrsdt cncsiiu ana national committee لجنة وطنية ديوان حقوق المؤلف وكالة تثمين نتائج البحث copyright author rights",en:"ONDA: National Office of Copyright and Neighbouring Rights (deposit for software, content, works). ANVREDET: National Agency for the Valorisation of Research Results and Technological Development (helps with prototypes and valorisation). DGRSDT: General Directorate of Scientific Research and Technological Development. CNCSIIU: the national coordination committee for monitoring innovation and university business incubators, which drafted the Decree 1275 implementation mechanisms."},
{s:"startup.dz & label benefits",fr:"startup.dz est la plateforme officielle où un porteur de projet ou une entreprise crée un compte, remplit le dossier (innovation, business model, équipe) et le soumet au comité national. Les startups labellisées peuvent bénéficier d’avantages fiscaux et douaniers, du financement de l’ASF et de programmes d’accompagnement. Pour les étudiants du décret 1275, la première étape est le label Projet innovant (valable 2 ans, renouvelable deux fois) ; après la création de l’entreprise, on peut demander le label Startup (4 ans, renouvelable une fois).",ar:"startup.dz هي المنصة الرسمية التي ينشئ فيها حامل المشروع أو الشركة حسابا ويملأ ملف المشروع (الابتكار، نموذج الأعمال، الفريق) ويرسله إلى اللجنة الوطنية. وتستفيد المؤسسات الحاصلة على العلامة من تحفيزات جبائية وجمركية وتمويل ASF وبرامج المرافقة. وبالنسبة لطلبة القرار 1275 الخطوة الأولى هي علامة «مشروع مبتكر» (صالحة سنتين وقابلة للتجديد مرتين)، وبعد إنشاء الشركة يمكن طلب علامة «مؤسسة ناشئة» (4 سنوات قابلة للتجديد مرة واحدة).",pub:1,k:"startup.dz label benefits avantages مزايا tax exemption fiscal incentives register inscription platform منصة apply how obtain",en:"startup.dz is the official platform where a project holder or company creates an account, fills the project file (innovation, business model, team) and submits it to the national committee. Labelled startups can access tax and customs incentives, ASF funding and support programmes. For students under Decree 1275 the first step is the Innovative Project label (valid 2 years, renewable twice); after creating the company the Startup label (4 years, renewable once) can be requested."},
{s:"End-to-end student pathway (Decree 1275/008)",fr:"Parcours : 1) former une équipe de 2 à 6 étudiants et choisir une idée innovante ; 2) la cellule d’orientation vous dirige vers l’incubateur, le CDE ou le CATI ; 3) suivre les formations et rédiger le BMC et la fiche technico-économique ; 4) réaliser un prototype (Fab-Lab, laboratoires, Ibtikar/ANVREDET) ; 5) obtenir la licence CATI et un numéro de dépôt (INAPI/ONDA) ; 6) s’inscrire sur startup.dz pour le label Projet innovant ; 7) soutenir devant le comité d’experts et recevoir l’attestation ; 8) créer l’entreprise et demander le label Startup ; 9) chercher des financements (NESDA, ASF, autres dispositifs).",ar:"المسار: 1) تكوين فريق من 2 إلى 6 طلبة واختيار فكرة مبتكرة؛ 2) توجيهك من خلية التوجيه إلى الحاضنة أو CDE أو CATI؛ 3) متابعة التكوينات وإعداد BMC والبطاقة التقنية والاقتصادية؛ 4) إنجاز النموذج الأولي (Fab-Lab أو المخابر أو منصة ابتكار/ANVREDET)؛ 5) الحصول على رخصة CATI ورقم الإيداع (INAPI/ONDA)؛ 6) التسجيل في startup.dz للحصول على علامة «مشروع مبتكر»؛ 7) المناقشة أمام لجنة الخبراء والحصول على الشهادة؛ 8) إنشاء الشركة وطلب علامة «مؤسسة ناشئة»؛ 9) البحث عن التمويل (NESDA وASF وغيرهما).",k:"how start comment commencer كيف أبدأ pathway roadmap steps etapes parcours path plan guide from idea to company startup",en:"Pathway: 1) form a team of 2–6 students and pick an innovative idea; 2) the orientation cell sends you to the incubator, CDE or CATI; 3) follow trainings and write the BMC and technical-economic sheet; 4) build a prototype (Fab-Lab, labs, Ibtikar/ANVREDET); 5) obtain the CATI licence and a deposit number (INAPI/ONDA); 6) register on startup.dz for the Innovative Project label; 7) defend before the expert committee and receive the sub-certificate; 8) create the company and request the Startup label; 9) seek funding (NESDA, ASF, other schemes)."},
{s:"Glossary",fr:"BMC : Business Model Canvas. MVP : produit minimum viable. PMF : adéquation produit-marché. CDE : Centre de développement de l’entrepreneuriat. CATI/TISC : Centre d’appui à la technologie et à l’innovation. INAPI : Institut national algérien de la propriété industrielle. ONDA : Office national des droits d’auteur. ANVREDET : Agence nationale de valorisation des résultats de la recherche. ASF : Fonds algérien des startups. NESDA/ANADE : agence de soutien à l’entrepreneuriat. CNCSIIU : comité national pour l’innovation et les incubateurs universitaires. MESRS : ministère de l’Enseignement supérieur et de la Recherche scientifique.",ar:"BMC: نموذج الأعمال التجاري. MVP: المنتج الأدنى القابل للتطبيق. PMF: ملاءمة المنتج للسوق. CDE: مركز تطوير المقاولاتية. CATI/TISC: مركز دعم التكنولوجيا والابتكار. INAPI: المعهد الوطني الجزائري للملكية الصناعية. ONDA: الديوان الوطني لحقوق المؤلف. ANVREDET: الوكالة الوطنية لتثمين نتائج البحث. ASF: صندوق تمويل المؤسسات الناشئة. NESDA/ANADE: وكالة دعم المقاولاتية. CNCSIIU: اللجنة الوطنية لمتابعة الابتكار وحاضنات الأعمال الجامعية. MESRS: وزارة التعليم العالي والبحث العلمي.",k:"glossary abbreviations acronyms signification meaning definition what is bmc mvp pmf ما معنى",en:"BMC: Business Model Canvas. MVP: minimum viable product. PMF: product-market fit. CDE: Entrepreneurship Development Center. CATI/TISC: Technology and Innovation Support Center. INAPI: Algerian National Institute of Industrial Property. ONDA: National Office of Copyright. ANVREDET: National Agency for Valorisation of Research Results. ASF: Algerian Startup Fund. NESDA/ANADE: entrepreneurship support agency. CNCSIIU: national committee for university innovation and incubators. MESRS: Ministry of Higher Education and Scientific Research."}

const PR=`You are Musta-SHARE (مستشار), the AI advisor of the House of AI, Université Badji Mokhtar – Annaba (UBMA). Domain: Algerian Ministerial Decree 1275 (27/09/2022) as amended by Decree 008 (23/02/2025); startup / economic-enterprise-project / patent graduation theses; labels (Innovative Project, Startup, Incubator, Scale-up) and startup.dz; university incubators, CDE, CATI, orientation cell; INAPI, ONDA, ANVREDET; patents; NESDA (formerly ANADE, also written NASDA) and ASF funding.
HOW TO ANSWER:
1. Understand the intent first. Users may write with typos, slang, Algerian dialect, mixed Arabic/French/English or bare keywords (e.g. "cati?", "combien brevet"). Infer the most likely meaning and answer it; ask at most one clarifying question, and only when an answer is truly impossible.
2. Ground every fact in CONTEXT and cite it as [n]. [OFFICIAL] items are decrees and ministry documents; [PUBLIC SOURCES] items come from public web sources, so tell the user to confirm amounts and dates with the institution. Combine several items when useful.
3. Never answer with a bare "I don't know". If CONTEXT only partly answers, give the relevant part, say which detail is not in the texts, and say who can confirm it (university incubator, CDE, CATI, INAPI, NESDA). Only if the question is entirely unrelated to this domain, say so politely in one sentence and offer 3 example questions you can answer.
4. Never invent article numbers, fees, dates or procedures that are not in CONTEXT. A short hint from general knowledge is allowed only if labelled "general guidance".
5. Format: direct answer first (1-2 sentences), then short "-" steps or bullets for how-to questions; about 170 words max; plain text; reply in the language of the QUESTION (Arabic, French or English).
6. Final line, exactly: NEXT: <follow-up question 1> | <follow-up question 2> (same language).`;
